<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GullyDelivery Kinshasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="p-6 flex justify-between items-center bg-white shadow-sm">
        <h1 class="text-2xl font-black text-red-600 italic">GullyDelivery</h1>
        <div class="flex items-center gap-6">
            <span class="text-sm font-bold text-gray-500"><i class="fas fa-map-marker-alt"></i> Kinshasa, Gombe</span>
            <a href="login.html" class="btn-primary px-8 py-2 rounded-full font-bold">Connexion</a>
        </div>
    </nav>

    <section class="p-12 grid lg:grid-cols-2 gap-12 items-center">
        <div>
            <h2 class="text-7xl font-extrabold leading-tight">Tes restos préférés <br>à <span class="text-red-600">Kinshasa</span>.</h2>
            <div class="mt-10 flex bg-white rounded-full p-2 shadow-gully max-w-lg border">
                <input type="text" placeholder="Qu'est-ce qu'on mange ?" class="flex-1 px-6 outline-none rounded-full">
                <button class="btn-primary px-10 py-4 rounded-full font-bold">Chercher</button>
            </div>
        </div>
        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=800" class="rounded-gully-lg shadow-2xl">
    </section>

    <section class="p-12">
        <h3 class="text-2xl font-black mb-8">Populaire à proximité</h3>
        <div class="grid md:grid-cols-3 gap-8">
            <a href="restaurant.html" class="bg-white rounded-gully overflow-hidden shadow-gully block">
                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500" class="h-48 w-full object-cover">
                <div class="p-6">
                    <h4 class="font-bold text-xl">Pizza Hut Gombe</h4>
                    <p class="text-gray-400 text-sm">20-30 min • 5.000 CDF Livraison</p>
                </div>
            </a>
        </div>
    </section>
</body>
</html>
