<main class="p-12 grid lg:grid-cols-3 gap-12">
    <div class="lg:col-span-2">
        <h3 class="text-3xl font-black mb-8">Menu</h3>
        <div class="grid gap-6">
            <div class="bg-white p-6 rounded-gully flex justify-between items-center shadow-sm border border-gray-50">
                <div class="flex items-center gap-6">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200" class="w-24 h-24 rounded-2xl">
                    <div>
                        <h4 class="font-bold text-lg">Burger Kin</h4>
                        <p class="text-gray-400 text-sm">Double steak, frites</p>
                        <span class="text-red-600 font-black">18.500 CDF</span>
                    </div>
                </div>
                <button onclick="addToCart(1, 'Burger Kin', 18500)" class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center font-bold text-2xl hover:bg-red-600 hover:text-white transition">+</button>
            </div>
        </div>
    </div>

    <aside class="bg-white p-8 rounded-gully shadow-gully h-fit sticky top-12 border border-gray-50">
        <h3 class="text-xl font-black mb-6 italic">Mon Panier</h3>
        <div id="cart-items-list" class="mb-6">
            <p class="text-gray-300 text-center py-4 italic text-sm">Votre panier attend une gourmandise...</p>
        </div>
        <div class="border-t border-dashed pt-4 space-y-2">
            <div class="flex justify-between text-sm"><span>Sous-total</span><span id="subtotal">0 CDF</span></div>
            <div class="flex justify-between text-sm"><span>Livraison</span><span>5.500 CDF</span></div>
            <div class="flex justify-between text-xl font-black pt-4 text-red-600"><span>Total</span><span id="total-price">0 CDF</span></div>
        </div>
        <button class="btn-primary w-full py-5 rounded-2xl font-bold mt-8">Commander via Mobile Money</button>
    </aside>
</main>
<script src="script.js"></script>
